name: forex

on_project_start: git stash && git pull && git stash pop

startup_window: shell

windows:
  - editor:
      - alias run="nvim ."
      - nvim .
  - shell:
      - tmux set-option set-titles-string 'forex'
      - clear
  - claude:
      - alias run="claude --dangerously-skip-permissions --chrome"
      - run
  - git: tig
  - webserver:
      - alias run="make watch"
      - run
